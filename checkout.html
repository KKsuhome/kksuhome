    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ЗАГОЛОВОК -->

    <h1 class="checkout-title">
        Оформлення замовлення
    </h1>

    <!-- ФОРМА -->

    <div class="checkout-form">

        <h2>Ваші дані</h2>

        <label for="name">Ім'я</label>
        <input type="text" id="name" placeholder="Введіть ваше ім'я">

        <label for="phone">Телефон</label>
        <input type="tel" id="phone" placeholder="+380...">

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="example@gmail.com">

        <label for="city">Місто</label>
        <input type="text" id="city" placeholder="Введіть місто">

              
           <h2>Спосіб доставки</h2>

<label>
    <input type="radio" name="delivery" value="Нова пошта — відділення">
    Нова пошта — у відділення (від 70 грн)
</label>

<label>
    <input type="text" id="nova-branch" placeholder="Номер та адреса відділення">
</label>

<label>
    <input type="radio" name="delivery" value="Нова пошта — поштомат">
    Нова пошта — у поштомат (від 80 грн)
</label>

<label>
    <input type="text" id="nova-locker" placeholder="Номер та адреса поштомату">
</label>

<label>
    <input type="radio" name="delivery" value="Кур'єр Нової пошти">
    Кур'єр Нової пошти (від 130 грн)
</label>

<label>
    <input type="text" id="nova-courier" placeholder="Повна адреса доставки">
</label>

<label>
    <input type="radio" name="delivery" value="Укрпошта — відділення">
    Укрпошта — у відділення (від 50 грн)
</label>

<label>
    <input type="text" id="ukr-branch" placeholder="Номер та адреса відділення">
</label>

<label>
    <input type="radio" name="delivery" value="Самовивіз">
    Самовивіз — безкоштовно
</label>

<p>
    Вартість доставки оплачується покупцем окремо при отриманні
    та не входить у суму замовлення.
</p>

<h2>Спосіб оплати</h2>

<label>
    <input type="radio" name="payment" value="Карткою на сайті">
    Карткою на сайті
</label>

<label>
    <input type="radio" name="payment" value="При отриманні — накладений платіж (2% від суми переказу + 20 грн.)">
    При отриманні — накладений платіж (2% від суми переказу + 20 грн.)
</label>

        <button type="button" class="order-button" onclick="submitOrder()">
            Підтвердити замовлення
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
